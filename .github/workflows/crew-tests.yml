name: crew-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  orchestration:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Test crew, agent observation, and control protocol
        run: swift test --filter 'DamsonCrewTests|DamsonAgentsTests|DamsonControlTests'
      - name: Build coordinator
        run: swift build --product damson-crew
      - name: Test CLI teardown against an isolated socket
        run: python3 scripts/test-crew-cli.py .build/debug/damson-crew
