name: crew-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  orchestration:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Test crew, agent observation, and control protocol
        run: swift test --filter 'DamsonCrewTests|DamsonAgentsTests|DamsonControlTests|DamsonComputerTests'
      - name: Test workbench protocols and file targets
        run: swift test --filter 'CommandLifecycleTests|ContextMenuFileTests|FilePathDetectorTests|MultiRowURLDetectorTests'
      - name: Test shell integration in a real zsh PTY
        run: python3 scripts/test-shell-integration.py
      - name: Build coordinator and app
        run: |
          swift build --product damson-crew
          swift build --product damson
      - name: Test CLI teardown against an isolated socket
        run: python3 scripts/test-crew-cli.py .build/debug/damson-crew
      - name: Test managed workflows with real worker processes
        run: python3 scripts/test-workflow-cli.py .build/debug/damson-crew
