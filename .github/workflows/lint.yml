name: lint

# Code-quality gate. SwiftLint runs on every push/PR and FAILS only on
# error-severity violations, so the baseline of warnings is tracked without
# blocking — drive it down over time, then tighten via `swiftlint --strict`.
#
# The job writes the error-severity violations into the run summary. Without
# that, a failure reports only "Found N violations, 1 serious" and the file has
# to be dug out of the annotations — which is how this workflow stayed red for
# weeks: nobody could see what to fix at a glance.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swiftlint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: |
          set +e
          swiftlint lint --reporter json > /tmp/lint.json
          status=$?
          set -e
          python3 - "$status" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          status = sys.argv[1]
          try:
              rows = json.load(open("/tmp/lint.json"))
          except Exception:
              print("SwiftLint produced no parseable report (exit %s)." % status)
              raise SystemExit
          errors = [r for r in rows if r.get("severity", "").lower() == "error"]
          warns = len(rows) - len(errors)
          print("## SwiftLint\n")
          print("%d error-severity, %d warnings.\n" % (len(errors), warns))
          if errors:
              print("These fail the build:\n")
              for r in errors:
                  print("- `%s:%s` %s (%s)" % (r.get("file", "?").split("/damson/")[-1],
                                               r.get("line"), r.get("reason"), r.get("rule_id")))
          else:
              print("No error-severity violations. Warnings are tracked, not blocking.")
          PY
          # SwiftLint's exit code is the gate; the summary above only explains it.
          exit $status
